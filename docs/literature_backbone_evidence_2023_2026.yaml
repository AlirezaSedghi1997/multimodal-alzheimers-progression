    name: Worst-dimension fusion audit
    literature: [LIT016]
    math: "Augmented Chebyshev scalarization over {AUC, Brier, cohort-probe, missing-modality}"
    code: src/evaluation/worst_dimension_audit.py
    eval: scripts/run_worst_dimension_fusion_audit.py
  IP3:
    name: MFSCA texture branch
    literature: [LIT018]
    math: "Hilbert-ordered 1D + MFDFA Hurst/spectrum proxies"
    code: src/features/mfsca_texture.py
    extract: scripts/extract_mfsca_texture_features.py
    priority: R3_stretch
  IP4:
    name: PET-guided KD sensitivity
    literature: [LIT006]
    train: scripts/run_pet_guided_kd_train.py
    note: Method X remains PET-free at inference
  IP5:
    name: PID-disentangled fusion (planned)
    literature: [LIT024]
    status: PLANNED

