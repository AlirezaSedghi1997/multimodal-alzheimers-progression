dry_run: true
inputs:
  pet_h5: caches/method_y/pet_mni_128_broad_s1_fbp_only_hq_v1.h5
  pet_input_list: data/method_y/pet_input_list_broad_s1_fbp_only.csv
  mri_h5: data/cached/archive/t1_volume_cache_128_real_20260712T203222Z_26fff22aa7de.h5
  mri_ckpt: models/method_x/best.pt
  s1_pet_ckpt_pattern: results/method_y_execution/broad_s1_fbp_only_hq_v1/checkpoints/pet_only_fold{fold}_dryrun.pt
  s1_pet_ckpt_dryrun_suffix: false
  stage_report_root: results/method_y_execution/broad_s1_fbp_only_hq_v1
fusion:
  type: bottleneck_cross_attention_plus_concat_residual
losses:
  pet_evidential_weight: 1.0
  centiloid_weight: 0.5
  tracer_adversarial_weight: 0.0
  tracer_adversarial_rationale: Method Y is FBP-only; no cross-tracer amyloid claim is allowed.
  fused_evidential_weight: 1.0
memory_controls:
  mixed_precision: true
  grad_accum: 4
  checkpointing: true
  batch_size: 1
compute:
  target_gpu_vram_gb: 8
  base_channels: 4
  hidden_dim: 128
  bottleneck_dim: 16
  num_heads: 2
  mri_backbone: resnet18_3d
  vram_budget_gb: 7.0
training:
  dry_run_epochs: 1
  train_epochs: 50
folds:
  manifest: results/method_y_execution/broad_s1_fbp_only_hq_v1/fold_manifest_s2.json
  n_folds: 4
  seed: 42
acceptance_gate:
  primary_metric: internal_val_auc
  target: 0.87
outputs:
  stage_report_root: results/method_y_execution/broad_s1_fbp_only_hq_v1
  plan_json: results/method_y_execution/broad_s1_fbp_only_hq_v1/method_y_stage_s2_plan.json
  validation_dir: results/method_y_execution/broad_s1_fbp_only_hq_v1/validation_artifacts_s2
  checkpoint_dir: results/method_y_execution/broad_s1_fbp_only_hq_v1/checkpoints
claim_boundary:
  allowed: FBP amyloid biomarker prediction only.
  forbidden:
    - cross-tracer amyloid claim
    - Alzheimer disease diagnosis
    - FTP as amyloid evidence
    - Method X PET contamination
