# BrainIAC raw-T1 preprocessing, schema v2 (Plan 002 / B2)
# Policy authority: governance/brainiac_preprocessing_r1_primary_v2_policy_v6.json
# This file holds layout/runtime knobs only; every scientific threshold lives
# in the policy JSON and is hash-bound into each receipt.

schema_version: 2
roots:
  primary: data/derived/method_x_brainiac/r1_primary_v2
  smoke: data/derived/method_x_brainiac/r1_primary_v2_smoke
  raw_read_only: "H:\\A4 Learn"
  locked_cache: data/cached/t1_volume_cache_128.h5
  master_catalog: data/processed/master_catalog.csv

modes:
  preflight: read_only_no_sample_output_write
  acceptance: all_real_gates_then_stop_before_primary
  smoke:
    limit: 12
    equivalence: 12_LABEL_BLIND_ONE_SEQUENTIAL_TWO_INDEPENDENT_PARALLEL
  run:
    membership_rows: 1669
    requires_calibration_threshold_manifest: true
  status: read_only

membership:
  fields: [sample_hash, t1_file_hash]
  expected_real_rows: 1669

calibration:
  sample_count: 32
  selection: lowest_sha256_of_sample_hash
  threshold_rule: median_pm_6_mad
  mad_zero_fallback: fixed_contract_bounds

sensitivity:
  sample_count: 64
  direct_route_role: sensitivity_only

orchestration:
  cpu_workers_max: 2
  gpu_workers_max: 1
  n4_samples_in_flight: 2
  registration_workers_max: 1
  itk_threads_default: 8
  worker_model: PARALLEL_N4_SERIAL_REGISTRATION_SERIAL_GPU
  equivalence_required: true
  equivalence_design: 12_LABEL_BLIND_ONE_SEQUENTIAL_TWO_INDEPENDENT_PARALLEL
  parallel_repeat_count: 2
  parallel_minimum_speedup_fraction: 0.15
  execution_profile_authority: HASH_LOCKED_LIVE_BYTE_VERIFIED

registration:
  transform: Euler3D_rigid
  metric: MattesMutualInformation
  histogram_bins: 50
  sampling_strategy: NONE_FULL
  threads: 1
  work_units: 1
  parameter_quantization_decimals: 4
  metric_quantization_decimals: 7

storage_locality:
  authoritative_artifacts: H_ONLY
  local_scratch: "C:\\Users\\USER\\AppData\\Local\\AMUSE-X\\brainiac_preprocessing_staging"
  local_scratch_max_bytes: 1073741824
  local_scratch_minimum_free_bytes: 21474836480
  silent_fallback: false

signal:
  clean_stop_exit_code: 75
  safe_boundary: after_current_sample_commit

device:
  default: cuda
  fallback: none
  cpu_role: test_fixtures_only_not_production

claim_ceiling: POST_HOC_INTERNAL_TECHNICAL_EVIDENCE
