    backbone: resnet10_3d
    fusion: cross_attention
    lr: 0.0001
    dropout: 0.10
    latent_dim: 128
    tab_hidden_dim: 32
    bottleneck_dim: 32
    latent_alignment_lambda: 0.0
    label_smoothing: 0.0
  - name: resnet34_cross_attention_bce_lr1e4_drop10
    backbone: resnet34_3d
    fusion: cross_attention
    lr: 0.0001
    dropout: 0.10
