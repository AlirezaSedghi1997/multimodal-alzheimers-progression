schema_version: 1
name: method_x_3d_candidate_grid_b5
description: B5 config-driven candidate grid for Method X 128-cubed 8GB-conscious HPO.
policy:
  b5_niftynet_config_driven: true
  method_x_pet_free: true
  official_resolution: 128
  min_gpu_planning_gb: 8
  default_grad_accum: 8
  require_amp_for_gpu: true
  require_checkpoint_for_gpu: true
  c1_distillation_candidates_allowed: false
candidate_defaults:
  attention: none
  alignment_head: linear
  tab_encoder: linear
  causal_adjustment: none
  q2_channel_gate: none
  fusion_num_heads: 2
  n_experts: 4
  moe_load_balance_lambda: 0.0
  task_loss: bce
  focal_gamma: 2.0
  focal_alpha: -1.0
  auc_margin: 1.0
  auc_loss_weight: 1.0
  ema_decay: 0.0
  swa: false
  swa_start_fraction: 0.8
  restore_best_at_end: true
  supervised_contrastive_alignment: false
  phenotypic_contrastive_alignment: false
  phenotypic_contrastive_lambda: 0.0
  phenotypic_temperature: 0.1
  contrastive_temperature: 0.07
  synib_lambda: 0.0
  scheduler: cosine
  warmup_epochs: 5
  pos_weight: auto
  aug_prob_scale: 0.2
  layerwise_lr_decay: 1.0
  discriminative_lr: false
  resolution: 128
  input_mode: mri_plus_tabular
candidates:
